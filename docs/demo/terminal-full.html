<!doctype html>
<html lang="zh-CN" data-theme="light" data-price-scheme="cn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>vnpy Web · 交易终端（合并版）</title>
<style>
/* ============================================================
   完整版 = v3 应用外壳 + v2 交易终端页
   - 桌面 ≥900：侧栏 + 报价条 + 图表 + 盘口 + 下单栏 + 底部委托区
   - 移动 <900：侧栏 → 抽屉；托盘 → 底部 tab；下单 → 底部抽屉
   - 视觉令牌沿用 chat-demo（浅色默认、蓝调中性、胶囊按钮）
   ============================================================ */

:root {
  --n-00:#fff; --n-50:#f9fafb; --n-60:#f5f6f7; --n-75:#f1f3f5;
  --n-100:#ebeff2; --n-150:#e9ecf2; --n-200:#e1e5ee; --n-300:#cfd3d6;
  --n-400:#adb2b8; --n-600:#81858c; --n-700:#61666b; --n-750:#43454a;
  --n-800:#353638; --n-850:#2c2c2e; --n-900:#1b1b1c; --n-950:#151517; --n-1000:#0f1115;
  --blue-50:#edf3fe; --blue-100:#e4edfd; --blue-300:#b7c8fe; --blue-450:#5686fe;
  --blue-500:#3964fe; --green-500:#22c55e; --green-600:#12a150;
  --red-400:#f25a5a; --red-600:#d64545; --amber-500:#f59e0b; --amber-600:#dd8629;

  --h-xs:28px; --h-s:32px; --h-m:36px; --h-l:40px; --h-xl:44px;
  --r-xs:8px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:24px; --r-pill:999px;
  --dur:180ms; --ease:cubic-bezier(.4,0,.2,1);

  --rail-w:240px; --rail-w-collapsed:64px;
  --topbar-h:52px;

  --font-sans: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
  /* 安全区只在类原生显示模式生效：普通标签页里浏览器已经让出了工具栏，
     再叠加 env() 会把顶栏/底栏撑高（vivo 浏览器会把自身工具栏高度报成 inset-top） */
  --safe-b: 0px;
  --safe-t: 0px;
}

[data-theme="light"] {
  color-scheme: light;
  --surface-canvas:#fff; --surface-sunken:var(--n-50); --surface-raised:#fff;
  --surface-raised-2:var(--n-75); --surface-hover:rgba(38,49,72,.06);
  --surface-active:rgba(38,49,72,.09);
  --surface-scrim:rgba(16,24,40,.32);
  --border-subtle:rgba(0,0,0,.06); --border-strong:rgba(0,0,0,.1); --border-hairline:rgba(0,0,0,.05);
  --text-primary:var(--n-1000); --text-secondary:var(--n-700); --text-muted:var(--n-600); --text-faint:var(--n-400);
  --accent:var(--blue-500); --accent-soft:var(--blue-50);
  --grid-line:rgba(15,17,21,.05);
  --elev-card:0 1px 2px rgba(0,0,0,.03);
  --elev-sheet:0 -8px 40px rgba(0,0,0,.12);
  --elev-drawer:8px 0 32px rgba(16,24,40,.14);
}
[data-theme="dark"] {
  color-scheme: dark;
  --surface-canvas:var(--n-950); --surface-sunken:var(--n-900); --surface-raised:var(--n-850);
  --surface-raised-2:var(--n-800); --surface-hover:rgba(255,255,255,.08);
  --surface-active:rgba(255,255,255,.11);
  --surface-scrim:rgba(0,0,0,.6);
  --border-subtle:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.12); --border-hairline:rgba(255,255,255,.05);
  --text-primary:var(--n-50); --text-secondary:var(--n-300); --text-muted:var(--n-400); --text-faint:var(--n-600);
  --accent:var(--blue-450); --accent-soft:rgba(86,134,254,.16);
  --grid-line:rgba(255,255,255,.05);
  --elev-card:none;
  --elev-sheet:0 -8px 40px rgba(0,0,0,.4);
  --elev-drawer:8px 0 32px rgba(0,0,0,.5);
}
[data-price-scheme="cn"] {
  --price-up:var(--red-600); --price-down:var(--green-600);
  --price-up-soft:rgba(214,69,69,.1); --price-down-soft:rgba(18,161,80,.1);
  --depth-up:rgba(214,69,69,.07); --depth-down:rgba(18,161,80,.07);
  --fill-up:#d64545; --fill-down:#12a150;
}
[data-price-scheme="intl"] {
  --price-up:var(--green-600); --price-down:var(--red-600);
  --price-up-soft:rgba(18,161,80,.1); --price-down-soft:rgba(214,69,69,.1);
  --depth-up:rgba(18,161,80,.07); --depth-down:rgba(214,69,69,.07);
  --fill-up:#12a150; --fill-down:#d64545;
}
[data-theme="dark"][data-price-scheme="cn"] { --price-up:#ff6b6b; --price-down:#3ddc97; --depth-up:rgba(255,107,107,.10); --depth-down:rgba(61,220,151,.10); --fill-up:#e04b4b; --fill-down:#16a06f; }
[data-theme="dark"][data-price-scheme="intl"] { --price-up:#3ddc97; --price-down:#ff6b6b; --depth-up:rgba(61,220,151,.10); --depth-down:rgba(255,107,107,.10); --fill-up:#16a06f; --fill-down:#e04b4b; }

@media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
  :root {
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
}

* { box-sizing:border-box; }
html, body { height:100%; }
html { touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; }
/* 应用外壳锁死文档滚动：body 固定到可见区域，避免手机上滑时把整页拖出空白 */
body {
  margin:0; position:fixed; inset:0; width:100%;
  height:var(--app-h, 100%);
  overflow:hidden; overscroll-behavior:none;
  background:var(--surface-canvas); color:var(--text-primary);
  font-family:var(--font-sans); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; background:none; border:none; }
a { color:inherit; text-decoration:none; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-family:var(--font-mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
.up { color:var(--price-up); } .down { color:var(--price-down); }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ================= 外壳 ================= */
.app { position:relative; display:flex; height:100%; overflow:hidden; background:var(--surface-canvas); }

.rail {
  position:relative; z-index:40; flex:none; display:flex; flex-direction:column;
  width:var(--rail-w); background:var(--surface-sunken);
  transition:width var(--dur) var(--ease), transform var(--dur) var(--ease);
  overflow:hidden;
}
.app[data-rail="collapsed"] .rail { width:var(--rail-w-collapsed); }
.rail__head { display:flex; align-items:center; gap:9px; height:var(--topbar-h); padding:0 12px; flex:none; }
.rail__logo {
  flex:none; width:24px; height:24px; border-radius:8px;
  background:linear-gradient(140deg,var(--blue-450),var(--blue-500));
  box-shadow:0 1px 2px rgba(57,100,254,.28);
}
.rail__brand { font-weight:600; font-size:14px; letter-spacing:-.01em; color:var(--text-primary); white-space:nowrap; }
.rail__collapse {
  margin-left:auto; width:28px; height:28px; border-radius:var(--r-xs);
  color:var(--text-faint); display:grid; place-items:center;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail__collapse:hover { background:var(--surface-hover); color:var(--text-primary); }
.app[data-rail="collapsed"] .rail__brand,
.app[data-rail="collapsed"] .rail__group-label,
.app[data-rail="collapsed"] .navitem__label,
.app[data-rail="collapsed"] .navitem__badge,
.app[data-rail="collapsed"] .rail__collapse,
.app[data-rail="collapsed"] .rail-account__meta { display:none; }
.app[data-rail="collapsed"] .rail__head { position:relative; justify-content:center; padding:0; }
.app[data-rail="collapsed"] .navitem { justify-content:center; gap:0; padding:0; }
.app[data-rail="collapsed"] .rail-account { justify-content:center; padding:0; }
/* 折叠后整条头部就是「展开」热区，悬停才露出箭头 */
.app[data-rail="collapsed"] .rail__collapse {
  display:grid; position:absolute; inset:0; width:100%; height:100%;
  border-radius:0; color:transparent;
}
.app[data-rail="collapsed"] .rail__collapse:hover { background:var(--surface-hover); color:var(--text-secondary); }
.app[data-rail="collapsed"] .rail__collapse svg { transform:rotate(180deg); }
.app[data-rail="collapsed"] .rail__head:hover .rail__logo { opacity:.12; }
.rail__logo { transition:opacity var(--dur) var(--ease); }

.rail__nav { flex:1; overflow-y:auto; padding:4px 10px 10px; display:flex; flex-direction:column; gap:16px; }
.rail__group { display:flex; flex-direction:column; gap:2px; }
.rail__group-label { padding:0 10px 6px; color:var(--text-faint); font-size:11px; font-weight:500; letter-spacing:.02em; }
.navitem {
  display:flex; align-items:center; gap:10px; height:40px; padding:0 10px; border-radius:var(--r-sm);
  color:var(--text-secondary); font-size:13.5px; font-weight:500; white-space:nowrap;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.navitem:hover { background:var(--surface-hover); color:var(--text-primary); }
.navitem:hover .navitem__icon { color:var(--text-primary); }
.navitem[aria-current="page"] { background:var(--surface-active); color:var(--text-primary); font-weight:600; }
.navitem__icon {
  flex:none; width:18px; height:18px; display:grid; place-items:center;
  color:var(--text-muted); transition:color var(--dur) var(--ease);
}
.navitem[aria-current="page"] .navitem__icon { color:var(--accent); }
.navitem__icon svg { width:18px; height:18px; display:block; }
.navitem__badge {
  margin-left:auto; min-width:18px; padding:0 5px; height:18px; border-radius:var(--r-pill);
  background:var(--surface-raised-2); color:var(--text-muted);
  font-family:var(--font-mono); font-size:10.5px; display:grid; place-items:center;
}
.navitem[aria-current="page"] .navitem__badge { background:rgba(57,100,254,.14); color:var(--accent); }

.rail__foot {
  flex:none; display:flex; flex-direction:column; gap:2px;
  padding:8px 10px calc(8px + var(--safe-b)); border-top:1px solid var(--border-hairline);
}
.rail__foot .navitem { height:38px; }
.rail-account {
  display:flex; align-items:center; gap:9px; height:44px; margin-top:2px; padding:0 8px;
  border-radius:var(--r-sm); text-align:left; width:100%;
  transition:background-color var(--dur) var(--ease);
}
.rail-account:hover { background:var(--surface-hover); }
.rail-account__avatar {
  flex:none; width:26px; height:26px; border-radius:50%;
  background:linear-gradient(140deg,#8ab0ff,var(--blue-500)); color:#fff;
  font-size:11px; font-weight:600; display:grid; place-items:center;
}
.rail-account__meta { display:flex; flex-direction:column; min-width:0; line-height:1.25; }
.rail-account__meta b { font-size:12.5px; font-weight:600; color:var(--text-primary); }
.rail-account__meta em { font-style:normal; font-size:11px; color:var(--text-faint); }
.rail-account .dot { margin-left:auto; flex:none; }

.main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
.topbar {
  display:flex; align-items:center; gap:10px;
  height:calc(var(--topbar-h) + var(--safe-t)); padding:var(--safe-t) 18px 0;
  flex:none; background:var(--surface-canvas); border-bottom:1px solid var(--border-subtle);
}
.hamburger { display:none; width:36px; height:36px; margin-left:-8px; border-radius:var(--r-xs); color:var(--text-secondary); }
.hamburger:hover { background:var(--surface-hover); }
.topbar__title { font-size:15px; font-weight:600; }
.spacer { flex:1; }
.status {
  display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px;
  border-radius:var(--r-pill); background:var(--surface-raised-2);
  color:var(--text-muted); font-size:11.5px; font-weight:500; white-space:nowrap;
}
.dot { width:7px; height:7px; border-radius:50%; background:var(--green-500); }

.page { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding:22px 24px 28px; }
.page[data-module="market"] { padding:0; display:flex; flex-direction:column; overflow:hidden; }

/* ================= 通用组件 ================= */
.pageHead { display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.pageHead h1 { margin:0 0 4px; font-size:20px; font-weight:600; letter-spacing:-.01em; }
.pageHead p { margin:0; color:var(--text-muted); font-size:13px; }
.pageHead__actions { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:var(--h-m); padding:0 16px; border-radius:var(--r-pill);
  font-size:13.5px; font-weight:500;
  transition:background-color var(--dur) var(--ease), opacity var(--dur) var(--ease);
}
.btn--primary { background:var(--accent); color:#fff; }
.btn--primary:hover { background:var(--blue-450); }
.btn--ghost { border:1px solid var(--border-strong); color:var(--text-secondary); }
.btn--ghost:hover { background:var(--surface-hover); color:var(--text-primary); }
.card { background:var(--surface-raised); border:1px solid var(--border-subtle); border-radius:var(--r-md); box-shadow:var(--elev-card); overflow:hidden; }
.card__head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border-hairline); }
.card__title { font-size:13.5px; font-weight:600; }
.card__meta { margin-left:auto; color:var(--text-muted); font-size:12px; }
.card__body { padding:16px; }
.grid-2 { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; }
.grid-3 { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px; }
.stack { display:flex; flex-direction:column; gap:14px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:12px; }
.kpi { padding:14px 16px; }
.kpi__label { color:var(--text-muted); font-size:12px; }
.kpi__value { margin-top:6px; font-family:var(--font-mono); font-size:22px; font-weight:600; }
.kpi__hint { margin-top:2px; color:var(--text-faint); font-size:11px; }
.pill { display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:var(--r-pill); font-size:11.5px; font-weight:500; }
.pill--ok { background:var(--price-down-soft); color:var(--price-down); }
.pill--warn { background:rgba(245,158,11,.12); color:var(--amber-600); }
.pill--muted { background:var(--surface-raised-2); color:var(--text-muted); }
.pill--blue { background:var(--accent-soft); color:var(--accent); }
.empty { display:flex; flex-direction:column; align-items:center; gap:10px; padding:48px 20px; text-align:center; }
.empty__icon { width:44px; height:44px; border-radius:var(--r-md); display:grid; place-items:center; background:var(--surface-raised-2); color:var(--text-faint); }
.empty__title { font-size:14px; font-weight:600; }
.empty__text { color:var(--text-muted); font-size:12.5px; max-width:340px; }
.field2 { display:flex; flex-direction:column; gap:6px; }
.field2 > span { color:var(--text-muted); font-size:12px; }
.input {
  height:38px; padding:0 12px; border-radius:var(--r-sm);
  border:1px solid var(--border-strong); background:var(--surface-raised);
  font-size:13.5px; outline:none; width:100%;
}
.input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:14px; }
.seg { display:inline-flex; padding:3px; border-radius:var(--r-pill); background:var(--surface-raised-2); gap:2px; }
.seg button { height:28px; padding:0 12px; border-radius:var(--r-pill); color:var(--text-muted); font-size:12.5px; }
.seg button[aria-pressed="true"] { background:var(--surface-raised); color:var(--text-primary); box-shadow:var(--elev-card); }
.table-wrap { overflow-x:auto; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch; }
.table { width:100%; border-collapse:collapse; font-size:13px; }
.table th { padding:10px 16px; text-align:left; color:var(--text-muted); font-size:11.5px; font-weight:500; border-bottom:1px solid var(--border-subtle); white-space:nowrap; }
.table td { padding:12px 16px; border-bottom:1px solid var(--border-hairline); white-space:nowrap; }
.table td.num, .table th.num { text-align:right; }
.table td.mono, .table th.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.table tr:last-child td { border-bottom:0; }
.taskList { display:flex; flex-direction:column; }
.taskRow { display:flex; align-items:center; gap:12px; padding:12px 16px; }
.taskRow + .taskRow { border-top:1px solid var(--border-hairline); }
.taskRow__name { font-size:13px; font-weight:500; }
.taskRow__meta { color:var(--text-muted); font-size:11.5px; font-family:var(--font-mono); }
.taskRow__ret { margin-left:auto; font-family:var(--font-mono); font-size:13px; font-weight:600; }
.strategyCard { padding:16px; display:flex; flex-direction:column; gap:10px; }
.strategyCard__top { display:flex; align-items:center; gap:8px; }
.strategyCard__name { font-size:14px; font-weight:600; }
.strategyCard__desc { color:var(--text-muted); font-size:12.5px; min-height:38px; }
.strategyCard__foot { display:flex; align-items:center; gap:8px; }
.logList { font-family:var(--font-mono); font-size:12px; }
.logRow { display:grid; grid-template-columns:64px 52px 1fr; gap:10px; padding:6px 16px; }
.logRow + .logRow { border-top:1px solid var(--border-hairline); }
.logRow__time { color:var(--text-faint); }
.logRow__lv { font-weight:600; }
.logRow__msg { color:var(--text-secondary); white-space:normal; }
.lv-info { color:var(--accent); } .lv-warn { color:var(--amber-600); } .lv-error { color:var(--red-600); } .lv-debug { color:var(--text-faint); }

.scrim {
  position:fixed; inset:0; z-index:50; background:var(--surface-scrim);
  opacity:0; pointer-events:none; transition:opacity var(--dur) var(--ease);
}
.scrim[data-open="true"] { opacity:1; pointer-events:auto; }

/* ================= 设置页（chat-demo 两栏式） ================= */
.page[data-module="settings"] { padding:0; display:flex; overflow:hidden; }
.set { display:flex; gap:28px; flex:1; min-height:0; padding:24px 24px 28px; }
.set__nav { flex:none; width:172px; display:flex; flex-direction:column; gap:2px; }
.set__item {
  display:flex; align-items:center; gap:8px; height:40px; padding:0 10px;
  border-radius:12px; color:var(--text-secondary); font-size:13.5px; font-weight:500; text-align:left;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.set__item:hover { background:var(--surface-hover); color:var(--text-primary); }
.set__item[aria-current="true"] { background:var(--surface-active); color:var(--text-primary); }
.set__content { flex:1; min-width:0; max-width:760px; overflow-y:auto; overscroll-behavior:contain; padding-right:8px; }
.set-sec[hidden] { display:none; }

.set-row { display:flex; align-items:center; gap:16px; min-height:60px; padding:12px 0; }
.set-row + .set-row { box-shadow:inset 0 1px 0 var(--border-hairline); }
.set-row--block { flex-direction:column; align-items:stretch; gap:0; }
.set-row__text { min-width:0; flex:1; }
.set-row__label { font-size:14px; line-height:22px; color:var(--text-primary); }
.set-row__desc { margin-top:2px; color:var(--text-muted); font-size:12px; line-height:18px; }
.set-row__ctrl { flex:none; display:flex; align-items:center; gap:8px; }

.set-themes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:10px; }
.set-theme {
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  height:82px; border:1px solid var(--border-strong); border-radius:12px;
  color:var(--text-secondary); font-size:13px;
  transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.set-theme:hover { background:var(--surface-hover); color:var(--text-primary); }
.set-theme[aria-pressed="true"] { background:var(--surface-active); border-color:transparent; color:var(--text-primary); font-weight:600; }
.set-theme svg { width:20px; height:20px; }

.set-schemes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
.set-scheme {
  display:flex; align-items:center; justify-content:center; gap:12px; height:56px; padding:0 12px;
  border:1px solid var(--border-strong); border-radius:12px;

    const r = c.getBoundingClientRect();
    if (!r.width || !r.height) return;
    c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = r.width, H = r.height;
    const padR = 52, padB = 14, padT = 16, padL = 8;
    const volH = Math.round(H * 0.16);
    const plotH = H - padB - padT - volH;
    const plotW = W - padR - padL;
    const view = state.viewBars;
    const hi = Math.max(...view.map(b => b.high)) + 4;
    const lo = Math.min(...view.map(b => b.low)) - 4;
    const maxVol = Math.max(...view.map(b => b.vol));
    const y = (v) => padT + (1 - (v - lo) / (hi - lo)) * plotH;
    const step = plotW / view.length;
    const bw = Math.max(2, Math.min(9, step * 0.62));
    const up = css('--price-up'), down = css('--price-down');

    ctx.clearRect(0, 0, W, H);
    ctx.font = `10px ${css('--font-mono') || 'monospace'}`;
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = css('--grid-line'); ctx.fillStyle = css('--text-muted');
    for (let i = 0; i <= 3; i++) {
      const v = lo + ((hi - lo) / 3) * i;
      const py = Math.round(y(v)) + 0.5;
      ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(padL + plotW, py); ctx.stroke();
      ctx.fillText(v.toFixed(0), padL + plotW + 6, py);
    }
    view.forEach((b, i) => {
      const cx = padL + step * i + step / 2;
      const col = b.close >= b.open ? up : down;
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(cx, y(b.high)); ctx.lineTo(cx, y(b.low)); ctx.lineWidth = 1; ctx.stroke();
      const top = y(Math.max(b.open, b.close));
      ctx.fillRect(cx - bw / 2, top, bw, Math.max(1, y(Math.min(b.open, b.close)) - top));
      const vh = (b.vol / maxVol) * (volH - 4);
      ctx.globalAlpha = .35; ctx.fillRect(cx - bw / 2, H - padB - vh, bw, vh); ctx.globalAlpha = 1;

    ctx.strokeStyle = css('--accent'); ctx.lineWidth = 1.4;

  /* ---------------- 路由 ---------------- */
  const pageEl = $('#page');
  let current = 'market';
  const scrollMap = {};
  const parseHash = () => {
    const id = (location.hash || '#/market').replace(/^#\/?/, '').split('/')[0];
    return TITLES[id] ? id : 'market';
  };
  function setActive(id) {
    $$('.navitem').forEach((a) => a.dataset.id === id ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  }

  function render(id) {
    if (scrollMap[current] !== undefined) scrollMap[current] = pageEl.scrollTop;
    current = id;
    pageEl.dataset.module = id;
    pageEl.innerHTML = PAGES[id] ? PAGES[id]() : '';
    $('#pageTitle').textContent = TITLES[id];
    setActive(id);
    closeDrawer();
    chartCanvas = $('#chart') || null;
    if (id === 'market') initMarket();
    if (id === 'settings') initSettings();
    if (id === 'backtest') $$('#runBt, #runBt2').forEach((b) => b && b.addEventListener('click', () => toast('回测任务已提交（演示）')));
    pageEl.scrollTop = scrollMap[id] || 0;
  }

  /* ---------------- 行情页初始化 ---------------- */
  function initMarket() {
    drawChart();
    const isMobile = window.matchMedia('(max-width: 899px)').matches;
    const dockBody = $('#dockBody');
    const panelBody = $('#panelBody');
    const bookDesktop = $('#bookDesktop');

    if (bookDesktop) bookDesktop.innerHTML = bookHtml();
    if (indexOfOrder() !== -1) { /* noop */ }
    if (dockBody) dockBody.innerHTML = ORDERS.length ? ordersHtml() : '<div class="t-empty">暂无委托</div>';
    if (panelBody) panelBody.innerHTML = panelHtml(isMobile ? 'book' : 'orders');

    // 托盘 tab（移动端）
    $$('[data-tab]').forEach((t) => t.addEventListener('click', () => {
      $$('[data-tab]').forEach((x) => x.setAttribute('aria-selected', 'false'));
      t.setAttribute('aria-selected', 'true');
      if (panelBody) panelBody.innerHTML = panelHtml(t.dataset.tab);
    }));
    // 底部 dock tab（桌面端）
    $$('[data-dock]').forEach((t) => t.addEventListener('click', () => {
      $$('[data-dock]').forEach((x) => x.setAttribute('aria-selected', 'false'));
      t.setAttribute('aria-selected', 'true');
      const k = t.dataset.dock;
      if (dockBody) dockBody.innerHTML = k === 'orders' ? ordersHtml() : k === 'positions' ? positionsHtml() : tradesHtml();
    }));
    // 周期
    $$('.t-tf button').forEach((b) => b.addEventListener('click', () => {
      $$('.t-tf button').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      state.viewBars = bars.slice(-Number(b.dataset.tf));
      drawChart();
    }));

    // 桌面内联下单
    const dSide = (side) => {
      state.side = side;
      $$('.t-order__seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.side === side)));
      const btn = $('#dSubmit');
      if (btn) { btn.dataset.side = side; btn.textContent = (side === 'buy' ? '买入开仓' : '卖出开仓') + ' rb2601'; }
    };
    $$('.t-order__seg button').forEach((b) => b.addEventListener('click', () => dSide(b.dataset.side)));
    $$('[data-dstep]').forEach((b) => b.addEventListener('click', () => {
      const input = b.dataset.dstep === 'price' ? $('#dPrice') : $('#dQty');
      input.value = Math.max(1, Number(input.value) + Number(b.dataset.dir));
      dCalc();
    }));
    $$('[data-dpct]').forEach((b) => b.addEventListener('click', () => {
      $$('[data-dpct]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      $('#dQty').value = Math.max(1, Math.round(Number(b.dataset.dpct) / 100 * 40));
      dCalc();
    }));
    $$('#dPrice, #dQty').forEach((i) => i && i.addEventListener('input', dCalc));
    const dSubmit = $('#dSubmit');
    if (dSubmit) dSubmit.addEventListener('click', () => {
      addOrder(Number($('#dPrice').value), Number($('#dQty').value));
      toast(`${state.side === 'buy' ? '买入' : '卖出'} ${$('#dQty').value} 手已提交（演示）`);
    });
    dCalc(); dSide(state.side);

    // 移动端动作栏 → 抽屉（只绑定动作栏，避免抽屉自身的 data-open 状态被误选中）
    $$('.t-actionbar [data-open]').forEach((b) => b.addEventListener('click', () => openSheet(b.dataset.open)));
  }
  function indexOfOrder() { return 0; }
  function dCalc() {
    const p = Number($('#dPrice')?.value) || 0;
    const q = Number($('#dQty')?.value) || 0;
    const amount = p * q * 10;
    if ($('#dAmount')) $('#dAmount').textContent = fmt(amount, 2);
    if ($('#dMargin')) $('#dMargin').textContent = fmt(amount * 0.13, 2);
  }

  function addOrder(price, qty) {
    ORDERS = [{
      t: new Date().toTimeString().slice(0, 5), sym: 'rb2601',
      side: state.side === 'buy' ? '买' : '卖', oc: '开仓',
      px: price, qty, filled: 0, st: '挂单中', live: true,
    }, ...ORDERS];
    const d = $('#dockBody'); if (d) d.innerHTML = ordersHtml();
    const n = $('#nOrders'); if (n) n.textContent = ORDERS.length;
    const nm = $('#nOrdersM'); if (nm) nm.textContent = ORDERS.length;

  /* ---------------- 抽屉 ---------------- */
  const rail = $('#rail'), scrim = $('#scrim'), menuBtn = $('#menuBtn'), app = $('#app');
  function openDrawer() {
    rail.dataset.open = 'true'; scrim.dataset.open = 'true';

    document.body.style.overflow = 'hidden';
    const first = rail.querySelector('.navitem');
    if (first) first.focus({ preventScroll: true });
  }
  function closeDrawer() {
    if (rail.dataset.open !== 'true') return;
    rail.dataset.open = 'false'; scrim.dataset.open = 'false';
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
    menuBtn.focus({ preventScroll: true });
  }
  menuBtn.addEventListener('click', () => rail.dataset.open === 'true' ? closeDrawer() : openDrawer());
  scrim.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    closeDrawer();
    if (sheet.dataset.open === 'true') closeSheet();
  });

  const collapseBtn = $('#collapseBtn');
  function setRail(mode) {
    const collapsed = mode === 'collapsed';
    app.dataset.rail = collapsed ? 'collapsed' : 'expanded';
    store.set('rail', app.dataset.rail);
    collapseBtn.title = collapsed ? '展开侧栏' : '折叠侧栏';
    collapseBtn.setAttribute('aria-label', collapseBtn.title);
    collapseBtn.setAttribute('aria-expanded', String(!collapsed));
    drawChart();
  }
  setRail(store.get('rail', 'expanded'));
  collapseBtn.addEventListener('click', () => {
    setRail(app.dataset.rail === 'collapsed' ? 'expanded' : 'collapsed');
  });

  /* ---------------- 移动端下单抽屉 ---------------- */
  const sheet = $('#sheet'), tScrim = $('#tScrim');

  function setSide(side) {
    state.side = side;
    const label = side === 'buy' ? '买入开仓' : '卖出开仓';
    $('#sheetTitle').textContent = label;
    $$('.t-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.side === side)));
    const tc = $('#toConfirm'), sb = $('#submitOrder');
    tc.dataset.side = side; sb.dataset.side = side;
    tc.textContent = side === 'buy' ? '下一步 · 买入' : '下一步 · 卖出';
    sb.textContent = side === 'buy' ? '确认买入' : '确认卖出';
    const cs = $('#cSide'); cs.textContent = label; cs.className = side === 'buy' ? 'up' : 'down';
    $('#cWarn').textContent = side === 'sell'
      ? '卖出开仓将建立空头持仓，请留意保证金与强平风险。'
      : '本单为模拟盘演示，不连接任何柜台。';
  }
  function sCalc() {
    const p = Number($('#sPrice').value) || 0, q = Number($('#sQty').value) || 0;
    const amount = p * q * 10;
    $('#sAmount').textContent = fmt(amount, 2);
    $('#sMargin').textContent = fmt(amount * 0.13, 2);
    $('#cPrice').textContent = p;
    $('#cQty').textContent = q + ' 手';
    $('#cAmount').textContent = fmt(amount, 2);
    $('#cMargin').textContent = fmt(amount * 0.13, 2);
    $('#cFee').textContent = fmt(amount * 0.0001, 2);
  }
  function openSheet(side) {
    if (!window.matchMedia('(max-width: 899px)').matches) return;
    setSide(side);
    sheet.dataset.open = 'true'; sheet.dataset.step = '0';
    tScrim.dataset.open = 'true';
    sheet.style.setProperty('--sheet-h', SNAP.half + '%');
    $('#toConfirm').focus({ preventScroll: true });
    sCalc();
  }
  function closeSheet() {
    sheet.dataset.open = 'false'; tScrim.dataset.open = 'false';
    sheet.style.setProperty('--sheet-h', '0%');
  }
  tScrim.addEventListener('click', closeSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  $('#sheetCancel').addEventListener('click', closeSheet);
  $$('.t-seg button').forEach((b) => b.addEventListener('click', () => setSide(b.dataset.side)));
  $$('.t-stepper [data-step]').forEach((b) => b.addEventListener('click', () => {
    const input = b.dataset.step === 'price' ? $('#sPrice') : $('#sQty');
    input.value = Math.max(1, Number(input.value) + Number(b.dataset.dir));
    sCalc();
  }));
  $$('[data-pct]').forEach((b) => b.addEventListener('click', () => {
    $$('[data-pct]').forEach((x) => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    $('#sQty').value = Math.max(1, Math.round(Number(b.dataset.pct) / 100 * 40));
    sCalc();
  }));
  $$('#sPrice, #sQty').forEach((i) => i.addEventListener('input', sCalc));
  const vp = $('.t-sheet__viewport');
  vp.addEventListener('scroll', () => { if (vp.scrollLeft !== 0) vp.scrollLeft = 0; });
  $('#toConfirm').addEventListener('click', () => { sheet.dataset.step = '1'; vp.scrollLeft = 0; $('#step1').scrollTop = 0; });
  $('#toEdit').addEventListener('click', () => { sheet.dataset.step = '0'; vp.scrollLeft = 0; });
  $('#submitOrder').addEventListener('click', () => {
    addOrder(Number($('#sPrice').value), Number($('#sQty').value));
    closeSheet();
    toast(`${state.side === 'buy' ? '买入' : '卖出'} ${$('#sQty').value} 手已提交（演示）`);
  });
  // 抓取条拖动
  const grab = $('#grab');
  let drag = null;
  grab.addEventListener('pointerdown', (e) => {
    drag = { y: e.clientY, h: sheet.getBoundingClientRect().height };
    sheet.dataset.dragging = 'true'; grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const appH = app.getBoundingClientRect().height;
    const next = Math.max(appH * 0.25, Math.min(appH * 0.94, drag.h - (e.clientY - drag.y)));
    sheet.style.setProperty('--sheet-h', next + 'px');
  });
  grab.addEventListener('pointerup', (e) => {
    if (!drag) return;
    const appH = app.getBoundingClientRect().height;
    const h = sheet.getBoundingClientRect().height;
    const dy = e.clientY - drag.y;
    drag = null; sheet.dataset.dragging = 'false';
    if (dy > 90 || h < appH * 0.35) return closeSheet();
    sheet.style.setProperty('--sheet-h', (h > appH * 0.78 ? SNAP.full : SNAP.half) + '%');
  });

  /* ---------------- 设置页 ---------------- */
  function initSettings() {
    const nav = $('#setNav'), content = $('#setContent');
    if (!nav || !content) return;

    const showSec = (id, remember = true) => {
      $$('[data-sec]', nav).forEach((b) => b.setAttribute('aria-current', String(b.dataset.sec === id)));
      $$('.set-sec', content).forEach((sec) => { sec.hidden = sec.dataset.sec !== id; });
      content.scrollTop = 0;
      if (remember) store.set('setSec', id);
    };
    $$('[data-sec]', nav).forEach((b) => b.addEventListener('click', () => showSec(b.dataset.sec)));
    showSec(store.get('setSec', 'general'), false);

    $$('.set-theme', content).forEach((b) => b.addEventListener('click', () => applyTheme(b.dataset.mode)));
    $$('.set-scheme', content).forEach((b) => b.addEventListener('click', () => applyScheme(b.dataset.scheme)));

    $$('[data-switch]', content).forEach((b) => b.addEventListener('click', () => {
      const next = b.getAttribute('aria-checked') !== 'true';
      b.setAttribute('aria-checked', String(next));
      if (b.dataset.switch === 'rail') {
        setRail(next ? 'collapsed' : 'expanded');
      } else {
        store.set(b.dataset.switch, next ? '1' : '0');
      }
      toast(next ? '已开启' : '已关闭');
    }));

    $$('[data-select]', content).forEach((el) => el.addEventListener('change', () => {
      store.set(el.dataset.select, el.value);
      toast('已切换：' + el.options[el.selectedIndex].text);
    }));

    const qtyOut = $('#defQty');
    let qty = Number(store.get('defQty', '1')) || 1;
    $$('[data-step]', content).forEach((b) => b.addEventListener('click', () => {
      qty = Math.max(1, Math.min(99, qty + Number(b.dataset.step)));
      store.set('defQty', String(qty));
      if (qtyOut) qtyOut.textContent = qty;
    }));

    const reset = $('#resetSet');
    if (reset) reset.addEventListener('click', () => {
      ['theme', 'scheme', 'setSec', 'thousand', 'compact', 'seconds', 'lang',
       'feed', 'push', 'reconnect', 'confirm', 'defQty'].forEach((k) => {
        try { localStorage.removeItem('app:' + k); } catch {}
      });
      toast('已恢复默认设置');
      applyTheme('light');
      applyScheme('cn');
      render('settings');
    });
  }

  /* ---------------- 主题 / 配色 ---------------- */
  const mediaDark = window.matchMedia('(prefers-color-scheme: dark)');

  function refreshMarketColors() {
    if (current !== 'market') return;
    const b = $('#bookDesktop'); if (b) b.innerHTML = bookHtml();
    const p = $('#panelBody'); if (p) p.innerHTML = panelHtml('book');
  }

  function applyTheme(mode) {
    store.set('theme', mode);
    const dark = mode === 'system' ? mediaDark.matches : mode === 'dark';
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $$('.set-theme').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
    refreshMarketColors();
    drawChart();
  }

  function applyScheme(v) {
    store.set('scheme', v);
    document.documentElement.dataset.priceScheme = v;
    $$('.set-scheme').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scheme === v)));
    refreshMarketColors();
  }

  mediaDark.addEventListener('change', () => {
    if (store.get('theme', 'light') === 'system') applyTheme('system');
  });

  /* ---------------- toast ---------------- */
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg; t.dataset.show = 'true';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.dataset.show = 'false'; }, 1800);
  }

  /* ---------------- 视口高度 ---------------- */
  // vivo / 夸克等浏览器的 100dvh 不含地址栏，底部面板会被压到工具栏下面；
  // 以 visualViewport（真实可见区域）为准写进 --app-h，图表再据此重绘。
  let appHFrame = 0, lastAppH = 0;
  function syncAppHeight() {
    const el = document.activeElement;
    // 软键盘弹出时 visualViewport 会缩小，此时保持外壳高度不变，避免整页塌缩
    if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
    const vv = window.visualViewport;
    const zoomed = !!(vv && vv.scale > 1.02);
    // 被强制缩放时 vv.height 是「可见区 ÷ 缩放比」，跟着用会让外壳塌缩、底下露出空白
    const h = zoomed
      ? (lastAppH || Math.round(window.innerHeight || 0))
      : Math.round((vv && vv.height) || window.innerHeight || 0);
    if (!h) return;
    if (!zoomed) lastAppH = h;
    document.documentElement.style.setProperty('--app-h', h + 'px');
    cancelAnimationFrame(appHFrame);
    appHFrame = requestAnimationFrame(() => drawChart());
  }
  syncAppHeight();
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', () => setTimeout(syncAppHeight, 160));
  document.addEventListener('focusout', () => setTimeout(syncAppHeight, 80));
  // iOS Safari / 部分 WebView 仍会派发 gesture 事件
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncAppHeight);
    window.visualViewport.addEventListener('scroll', syncAppHeight);
  }

  /* ---------------- 启动 ---------------- */
  const bootMode = store.get('theme', 'light');
  document.documentElement.dataset.theme =
    (bootMode === 'system' ? mediaDark.matches : bootMode === 'dark') ? 'dark' : 'light';
  document.documentElement.dataset.priceScheme = store.get('scheme', 'cn');

  window.addEventListener('hashchange', () => render(parseHash()));
  window.addEventListener('resize', () => { if (window.matchMedia('(max-width: 899px)').matches) closeDrawer(); drawChart(); });

  setInterval(() => {
    quote.last = Math.max(3380, Math.min(3470, quote.last + (rnd() > .5 ? 1 : -1)));
    if (current !== 'market') return;
    const d = quote.last - quote.prevClose;
    const last = $('#qLast'), chg = $('#qChg'), pct = $('#qPct');
    if (!last) return;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : '';
    [last, chg, pct].forEach((el) => { el.classList.remove('up', 'down'); if (cls) el.classList.add(cls); });
    last.textContent = quote.last;
    chg.textContent = (d > 0 ? '+' : '') + d;
    pct.textContent = (d > 0 ? '+' : '') + (d / quote.prevClose * 100).toFixed(2) + '%';
    drawChart();
  }, 1800);

  render(parseHash());
})();
</script>
</body>
</html>
